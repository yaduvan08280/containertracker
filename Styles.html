<style>
:root{
  --bg:#F4F1E9; --surface:#FCFAF5; --surface2:#FFFFFF;
  --ink:#1B1A17; --ink-soft:#6C685D; --ink-faint:#9A968B;
  --line:#E8E3D6; --line-soft:#F0ECE1;
  --amber:#F2C14E; --amber-deep:#D9A52C; --amber-wash:#FBEFCB;
  --charcoal:#232220; --charcoal-2:#2E2C29;
  --ok:#4F9D69; --ok-wash:#E4F0E6;
  --warn:#E0892F; --warn-wash:#FBEAD3;
  --bad:#CF4F33; --bad-wash:#F8E2DB;
  --info:#5E7FA6; --info-wash:#E6ECF3;
  --r-lg:26px; --r-md:18px; --r-sm:12px;
  --shadow:0 1px 2px rgba(27,26,23,.04), 0 8px 24px -12px rgba(27,26,23,.12);
  --shadow-lift:0 4px 12px rgba(27,26,23,.06), 0 24px 48px -20px rgba(27,26,23,.22);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-feature-settings:"zero" 1}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--info)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#DAD4C5;border-radius:8px;border:2px solid var(--bg)}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--ink)}
[hidden]{display:none!important}

/* ---------- boot / login ---------- */
.boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:var(--bg);z-index:200}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--amber-deep);animation:sp .8s linear infinite}
.spin.sm{width:14px;height:14px;border-width:2px}
@keyframes sp{to{transform:rotate(360deg)}}
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login-art{background:var(--charcoal);color:#F4F0E5;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-art h1{font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1.05;max-width:420px}
.login-art h1 em{font-style:normal;color:var(--amber)}
.login-art p{color:#A9A597;margin-top:14px;max-width:380px}
.login-art>div{position:relative;z-index:1}
.boxes{position:absolute;right:-50px;top:120px;z-index:0!important;display:grid;grid-template-columns:repeat(3,120px);gap:10px;opacity:.9;transform:rotate(-8deg)}
.boxes i{height:56px;border-radius:8px;background:repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 3px,transparent 3px 14px),var(--amber)}
.boxes i:nth-child(2n){background:repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 3px,transparent 3px 14px),#5E7FA6}
.boxes i:nth-child(3n){background:repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 3px,transparent 3px 14px),#CF4F33}
.login-form{display:flex;align-items:center;justify-content:center;padding:32px 20px}
.login-card{width:min(380px,100%)}
.login-card h2{font-size:24px;font-weight:800;letter-spacing:-.03em}
.login-card .sub{color:var(--ink-soft);margin:6px 0 24px}
.login-err{background:var(--bad-wash);color:var(--bad);border-radius:10px;padding:9px 12px;font-size:12.5px;margin-bottom:12px;font-weight:500}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:var(--charcoal);color:#EFEBDF;padding:22px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 18px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--amber);flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:var(--charcoal)}
.brand-name{font-weight:800;font-size:16px;letter-spacing:-.02em;line-height:1.05}
.brand-sub{font-size:10.5px;color:#9C988A;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav-label{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#85816F;padding:14px 10px 6px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:11px;color:#C9C5B7;font-size:13.5px;font-weight:500;transition:.15s;width:100%;text-align:left}
.nav-item:hover{background:rgba(255,255,255,.05);color:#fff}
.nav-item.on{background:var(--amber);color:var(--charcoal);font-weight:600}
.nav-item .ic{width:17px;height:17px;flex:0 0 auto}
.nav-item .nb{margin-left:auto;background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;border-radius:10px;padding:1px 7px}
.nav-item.on .nb{background:var(--charcoal);color:var(--amber)}
.side-foot{margin-top:auto;padding:12px 10px 4px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#85816F}
.me{display:flex;align-items:center;gap:10px;cursor:pointer;border-radius:12px;padding:6px;margin:-6px}
.me:hover{background:rgba(255,255,255,.05)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--amber);color:var(--charcoal);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px;flex:0 0 auto}
.me b{color:#EFEBDF;font-size:13px;display:block}
.src-pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:#EFEBDF;background:rgba(255,255,255,.07);padding:5px 9px;border-radius:20px;margin-top:10px;cursor:pointer}
.src-dot{width:7px;height:7px;border-radius:50%;background:var(--amber)}
.src-dot.live{background:#5FD08B;box-shadow:0 0 0 3px rgba(95,208,139,.2)}
.src-dot.busy{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}

.main{padding:26px 30px 70px;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.hello{display:flex;align-items:center;gap:12px;min-width:0}
.hello h1{font-size:25px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.hello p{color:var(--ink-soft);font-size:13px;margin-top:3px}
.topbar-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:9px;background:var(--surface2);border:1px solid var(--line);border-radius:22px;padding:9px 15px;min-width:290px;box-shadow:var(--shadow)}
.search:focus-within{border-color:var(--amber-deep)}
.search input{border:none;outline:none;background:none;width:100%;font-size:13px}
.search svg{flex:0 0 auto;color:var(--ink-faint)}
.search .x{color:var(--ink-faint);font-size:16px;line-height:1}
.menu-btn{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:22px;font-weight:600;font-size:13px;transition:.15s;border:1px solid transparent;white-space:nowrap}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-dark{background:var(--charcoal);color:#F6F2E7}
.btn-dark:hover{background:#000}
.btn-amber{background:var(--amber);color:var(--charcoal)}
.btn-amber:hover{background:var(--amber-deep)}
.btn-ghost{background:var(--surface2);color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{border-color:#D6D0C0;box-shadow:var(--shadow)}
.btn-ok{background:var(--ok);color:#fff}
.btn-bad{background:var(--bad-wash);color:var(--bad)}
.btn-bad:hover{background:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn .spin{border-color:rgba(0,0,0,.15);border-top-color:currentColor}
.icon-btn{width:30px;height:30px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-faint);transition:.15s}
.icon-btn:hover{background:var(--line-soft);color:var(--ink)}

/* ---------- cards ---------- */
.grid{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow);min-width:0}
.card+.card{margin-top:16px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h h3{font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.card-h .sub{font-size:11.5px;color:var(--ink-faint)}
.eyebrow{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
.row-2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-top:16px}
.row-2 .card+.card{margin-top:0}
.empty{padding:28px 10px;text-align:center;color:var(--ink-faint);font-size:13px}
.empty b{display:block;color:var(--ink-soft);font-size:14px;margin-bottom:4px}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden;text-align:left}
button.kpi{cursor:pointer;transition:.15s}
button.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.kpi.feature{background:var(--charcoal);border-color:var(--charcoal);color:#F4F0E5}
.kpi.feature .kpi-label{color:#A9A597}
.kpi.feature .kpi-sub{color:#8C8979}
.kpi.bad .kpi-val{color:var(--bad)}
.kpi-label{font-size:12px;color:var(--ink-soft);font-weight:600;display:flex;align-items:center;gap:7px}
.kpi-val{font-size:34px;font-weight:800;letter-spacing:-.04em;margin-top:9px;line-height:1}
.kpi-val .u{font-size:15px;font-weight:600;color:var(--ink-faint);margin-left:3px}
.kpi-sub{font-size:11.5px;color:var(--ink-faint);margin-top:7px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.kpi-chip{display:inline-flex;align-items:center;gap:3px;font-weight:700;padding:1px 6px;border-radius:8px;font-size:11px}
.kpi-chip.up{background:var(--ok-wash);color:var(--ok)}
.kpi-chip.down{background:var(--bad-wash);color:var(--bad)}
.kpi-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi-strip .kpi{padding:16px 16px 14px}
.kpi-strip .kpi-val{font-size:28px}

/* pipeline rail (signature) */
.rail{display:flex;align-items:stretch;position:relative;padding:6px 0;overflow-x:auto}
.rail-node{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;min-width:74px;cursor:pointer}
.rail-line{position:absolute;top:29px;left:-50%;width:100%;height:3px;background:var(--line);z-index:0}
.rail-node:first-child .rail-line{display:none}
.rail-dot{width:44px;height:44px;border-radius:14px;background:var(--surface2);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;z-index:1;position:relative;color:var(--ink-soft);transition:.2s;margin-top:8px}
.rail-dot.has{border-color:var(--amber);background:var(--amber-wash);color:var(--amber-deep)}
.rail-dot.bad{border-color:var(--bad);background:var(--bad-wash);color:var(--bad)}
.rail-dot .cnt{position:absolute;top:-8px;right:-8px;min-width:20px;height:20px;padding:0 5px;border-radius:11px;background:var(--charcoal);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.rail-dot .cnt.r{background:var(--bad)}
.rail-node:hover .rail-dot{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.rail-name{font-size:11px;font-weight:600;margin-top:9px;text-align:center;color:var(--ink-soft);letter-spacing:-.01em;line-height:1.2;padding:0 2px}
.rail-node.on .rail-dot{border-color:var(--charcoal);background:var(--charcoal);color:var(--amber)}

/* badges & chips */
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.badge .d{width:6px;height:6px;border-radius:50%;background:currentColor}
.b-active{background:var(--amber-wash);color:var(--amber-deep)}
.b-wait{background:var(--info-wash);color:var(--info)}
.b-done{background:var(--ok-wash);color:var(--ok)}
.b-halt{background:var(--bad-wash);color:var(--bad)}
.b-warn{background:var(--warn-wash);color:var(--warn)}
.b-queued{background:#EEEADE;color:var(--ink-soft)}
.due{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.due.ok{background:var(--ok-wash);color:var(--ok)}
.due.warn{background:var(--warn-wash);color:var(--warn)}
.due.bad{background:var(--bad-wash);color:var(--bad)}
.due.mute{background:#EEEADE;color:var(--ink-soft)}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:11.5px;color:var(--ink-soft)}
.chip b{color:var(--ink);font-weight:600}
.pill-t{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--surface2);color:var(--ink-soft);cursor:pointer;transition:.12s}
.pill-t.on{background:var(--charcoal);color:#F4F0E5;border-color:var(--charcoal)}
.pill-t:hover{border-color:#D6D0C0}

/* segmented tabs */
.ctrl-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:7px 14px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--ink-soft)}
.seg button.on{background:var(--charcoal);color:#F4F0E5}
.seg button .n{opacity:.6;margin-left:4px;font-weight:500}
.date-in{background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:8px 11px}
.ctrl-bar label.lbl{font-size:11.5px;font-weight:600;color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px}
.sel{background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:8px 11px}

/* ---------- pending rows ---------- */
.plist{display:flex;flex-direction:column}
.prow{display:flex;align-items:center;gap:12px;padding:11px 8px;border-bottom:1px solid var(--line-soft);cursor:pointer;border-radius:10px;transition:.12s}
.prow:last-child{border-bottom:none}
.prow:hover{background:var(--amber-wash)}
.snum{width:34px;height:34px;border-radius:10px;background:var(--charcoal);color:var(--amber);font-weight:800;font-size:12.5px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.snum.bad{background:var(--bad);color:#fff}
.snum.doc{background:var(--info);color:#fff}
.prow-main{min-width:0;flex:1}
.prow-main .t{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow-main .s{font-size:11.5px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow-r{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:0 0 auto}
.callee{font-size:11.5px;color:var(--ink-soft)}
.callee a{font-weight:700;color:var(--ink);text-decoration:none}
.callee a:hover{color:var(--bad)}
.more{display:block;width:100%;padding:10px;text-align:center;font-weight:600;font-size:12.5px;color:var(--ink-soft);border-radius:10px;margin-top:6px}
.more:hover{background:var(--line-soft);color:var(--ink)}

/* ---------- container tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.ctile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:15px 16px 13px;box-shadow:var(--shadow);cursor:pointer;transition:.15s;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.ctile:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift);border-color:#D6D0C0}
.ctile.over{border-color:#EFC2B6;background:linear-gradient(180deg,#FDF3EF,var(--surface) 60%)}
.ctile.closed{opacity:.8}
.ct-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ct-no{font-weight:700;font-size:14.5px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct-no.na{color:var(--ink-faint);font-family:inherit;font-weight:600;font-size:13px}
.ct-sub{font-size:12px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct-sub b{color:var(--ink)}
.mrail{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin:6px 0 2px}
.mrail i{height:6px;border-radius:3px;background:var(--line)}
.mrail i.d{background:var(--ok)}
.mrail i.l{background:#E9A08D}
.mrail i.c{background:var(--amber)}
.mrail i.x{background:var(--bad)}
.ct-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--ink-soft)}
.ct-foot .st{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.bgroup{margin-bottom:20px}
.bgroup-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:4px 4px 10px}
.bgroup-h h4{font-size:15px;font-weight:800;letter-spacing:-.02em}
.bgroup-h .m{font-size:12px;color:var(--ink-faint)}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(27,26,23,.42);opacity:0;pointer-events:none;transition:.25s;z-index:40;backdrop-filter:blur(2px)}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;height:100dvh;width:min(700px,96vw);background:var(--bg);z-index:50;transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);overflow-y:auto;box-shadow:var(--shadow-lift)}
.drawer.on{transform:none}
.dr-head{position:sticky;top:0;background:var(--charcoal);color:#F4F0E5;padding:20px 26px 0;z-index:3}
.dr-close{position:absolute;top:16px;right:18px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center}
.dr-close:hover{background:rgba(255,255,255,.2)}
.dr-t{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-right:44px}
.dr-slab{font-size:22px;font-weight:800;letter-spacing:-.01em}
.dr-meta{display:flex;gap:6px 16px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:#B7B3A4}
.dr-meta b{color:#F4F0E5;font-weight:600}
.dr-tabs{display:flex;gap:2px;margin-top:14px;overflow-x:auto}
.dr-tabs button{padding:10px 14px;font-size:12.5px;font-weight:600;color:#A9A597;border-bottom:3px solid transparent;white-space:nowrap}
.dr-tabs button.on{color:var(--amber);border-bottom-color:var(--amber)}
.dr-tabs button .n{background:var(--amber);color:var(--charcoal);border-radius:8px;padding:0 6px;font-size:10.5px;margin-left:5px}
.dr-body{padding:20px 26px 60px}
.dr-sec-t{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;margin:22px 0 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.dr-sec-t:first-child{margin-top:0}
.admin-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.attr-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.attr{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 13px;min-width:0}
.attr .k{font-size:10.5px;color:var(--ink-faint);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.attr .v{font-size:14px;font-weight:600;margin-top:3px;word-break:break-word}
.attr .v.e{color:var(--ink-faint);font-weight:500}
.pendchg{margin-top:5px;font-size:11.5px;background:var(--warn-wash);color:var(--warn);border-radius:7px;padding:3px 8px;display:inline-block;font-weight:600}

/* action card */
.act{background:var(--surface2);border:2px solid var(--amber);border-radius:var(--r-md);padding:18px;margin-bottom:18px;box-shadow:0 0 0 4px var(--amber-wash)}
.act.bad{border-color:var(--bad);box-shadow:0 0 0 4px var(--bad-wash)}
.act.wait{border:1px dashed #D6D0C0;box-shadow:none;background:var(--surface)}
.act-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.act-h h4{font-size:15px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
.act-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500;color:var(--ink-soft);cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--charcoal)}

/* forms */
